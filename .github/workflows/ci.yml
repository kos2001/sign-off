name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
        env:
          POSTGRES_USER: signoff
          POSTGRES_PASSWORD: signoff
          POSTGRES_DB: signoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signoff -d signoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog verilator yosys
      - name: Require RTL tools
        run: |
          for tool in iverilog vvp verilator yosys; do
            command -v "$tool"
          done
          iverilog -V
          vvp -V
          verilator --version
          yosys -V
      - run: pip install --require-hashes -r requirements.txt
      - run: pip check
      - run: python scripts/check_dependencies.py
      - name: Verify PostgreSQL fresh and legacy migrations
        env:
          SIGNOFF_POSTGRES_TEST_URL: postgresql+psycopg://signoff:signoff@127.0.0.1:5432/signoff
        run: python scripts/check_postgres_migrations.py
      - run: python -m pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies (including build tools)
        run: pnpm audit --audit-level=moderate
      - run: pnpm build
      - name: Check RTL diagnostic navigation parsing
        run: node ../scripts/check_rtl_diagnostics.mjs

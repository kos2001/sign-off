name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog verilator yosys
      - name: Require RTL tools
        run: |
          for tool in iverilog vvp verilator yosys; do
            command -v "$tool"
          done
          iverilog -V
          vvp -V
          verilator --version
          yosys -V
      - run: pip install --require-hashes -r requirements.txt
      - run: pip check
      - run: python scripts/check_dependencies.py
      - run: python -m pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
